    function cariData() {
        // Ambil inputan user
        const inputNama = document.getElementById("nama").value.trim().toUpperCase();
        const inputNisn = document.getElementById("nisn").value.trim();
        
        // Element untuk hasil dan error
        const hasilDiv = document.getElementById("hasil");
        const errorDiv = document.getElementById("error");

        // Reset tampilan
        hasilDiv.style.display = "none";
        errorDiv.style.display = "none";

        if(inputNama === "" || inputNisn === "") {
            alert("Harap isi Nama dan NISN terlebih dahulu!");
            return;
        }

        // Mencari di dalam databaseSiswa
        const siswaDitemukan = databaseSiswa.find(
            siswa => siswa.nama === inputNama && siswa.nisn === inputNisn
        );

        if (siswaDitemukan) {
            // Tampilkan hasil
            document.getElementById("res-nama").innerText = siswaDitemukan.nama;
            document.getElementById("res-nisn").innerText = siswaDitemukan.nisn;
            document.getElementById("res-numerasi").innerText = siswaDitemukan.numerasi;
            document.getElementById("res-literasi").innerText = siswaDitemukan.literasi;
            hasilDiv.style.display = "block";
        } else {
            // Tampilkan error
            errorDiv.style.display = "block";
        }
    }
