<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard TKA SMPN 6 Jember</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2, h3, h4 {
            text-align: center;
            margin: 5px 0;
            color: #333;
        }
        h2 { color: #0056b3; }
        .divider {
            border-bottom: 2px solid #0056b3;
            margin: 20px 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[readonly] {
            background-color: #e9ecef;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004494;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #c3e6cb;
            background-color: #d4edda;
            border-radius: 4px;
            display: none;
        }
        .error-box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #f5c6cb;
            background-color: #f8d7da;
            color: #721c24;
            border-radius: 4px;
            display: none;
            text-align: center;
        }
        .score-item {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .score-title {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>DASHBOARD HASIL TKA</h2>
    <h3>SMPN 6 JEMBER</h3>
    <h4>Tahun Pelajaran 2025/2026</h4>
    <div class="divider"></div>

    <div class="form-group">
        <label for="nama">Nama Peserta</label>
        <input type="text" id="nama" placeholder="Masukkan Nama Lengkap" required>
    </div>
    
    <div class="form-group">
        <label for="kelas">Kelas</label>
        <input type="text" id="kelas" value="IX" readonly>
    </div>

    <div class="form-group">
        <label for="nisn">NISN</label>
        <input type="text" id="nisn" placeholder="Masukkan NISN" required>
    </div>

    <button onclick="cariData()">Cari Nilai</button>

    <div id="hasil" class="result-box">
        <h4 style="margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Hasil Pencarian</h4>
        <div class="score-item"><span class="score-title">Nama:</span> <span id="res-nama"></span></div>
        <div class="score-item"><span class="score-title">NISN:</span> <span id="res-nisn"></span></div>
        <div class="score-item"><span class="score-title">Nilai TKA Numerasi:</span> <span id="res-numerasi"></span></div>
        <div class="score-item"><span class="score-title">Nilai TKA Literasi:</span> <span id="res-literasi"></span></div>
    </div>

    <div id="error" class="error-box">
        Data siswa tidak ditemukan. Pastikan Nama dan NISN diketik dengan benar.
    </div>
</div>

<script>
    // DATABASE SEDERHANA: Diambil dari dokumen DKHTKA
    // Saya memasukkan 10 siswa pertama sebagai contoh. Anda dapat menambahkan siswa lainnya
    // dengan menyalin format { nama: "...", nisn: "...", numerasi: "...", literasi: "..." }
    const databaseSiswa = [
        { nama: "AMIRA WAHYU PUTRI WARDANA", nisn: "0106910199", numerasi: "43.33 (Memadai)", literasi: "70.00 (Memadai)" },
        { nama: "SAYYIDATI IRHAMATUN SUHAIBAH", nisn: "0102890629", numerasi: "60.00 (Baik)", literasi: "80.00 (Baik)" },
        { nama: "DARREN ALTAF FAVIAN PERMANA", nisn: "0118139635", numerasi: "53.33 (Memadai)", literasi: "80.00 (Baik)" },
        { nama: "GILANG MAULANA CAHYA DWI PUTRA", nisn: "0118002398", numerasi: "60.00 (Baik)", literasi: "76.67 (Baik)" },
        { nama: "TALITHA NAJLA NADIRA", nisn: "0116867245", numerasi: "26.67 (Kurang)", literasi: "73.33 (Memadai)" },
        { nama: "YENI KURNIAWATI", nisn: "0111587052", numerasi: "43.33 (Memadai)", literasi: "73.33 (Memadai)" },
        { nama: "WILBERT VETO PRADIPA", nisn: "0105634992", numerasi: "36.67 (Memadai)", literasi: "83.33 (Baik)" },
        { nama: "FAHRI SATRIA", nisn: "0118594158", numerasi: "40.00 (Memadai)", literasi: "86.67 (Baik)" },
        { nama: "DWIKO PUTRA HERLAMBANG", nisn: "0103063599", numerasi: "36.67 (Memadai)", literasi: "60.00 (Memadai)" },
        { nama: "NAINA ULAYYA", nisn: "0106930331", numerasi: "33.33 (Memadai)", literasi: "66.67 (Memadai)" }
    ];

    function cariData() {
        // Ambil inputan user
        const inputNama = document.getElementById("nama").value.trim().toUpperCase();
        const inputNisn = document.getElementById("nisn").value.trim();
        
        // Element untuk hasil dan error
        const hasilDiv = document.getElementById("hasil");
        const errorDiv = document.getElementById("error");

        // Reset tampilan
        hasilDiv.style.display = "none";
        errorDiv.style.display = "none";

        if(inputNama === "" || inputNisn === "") {
            alert("Harap isi Nama dan NISN terlebih dahulu!");
            return;
        }

        // Mencari di dalam databaseSiswa
        const siswaDitemukan = databaseSiswa.find(
            siswa => siswa.nama === inputNama && siswa.nisn === inputNisn
        );

        if (siswaDitemukan) {
            // Tampilkan hasil
            document.getElementById("res-nama").innerText = siswaDitemukan.nama;
            document.getElementById("res-nisn").innerText = siswaDitemukan.nisn;
            document.getElementById("res-numerasi").innerText = siswaDitemukan.numerasi;
            document.getElementById("res-literasi").innerText = siswaDitemukan.literasi;
            hasilDiv.style.display = "block";
        } else {
            // Tampilkan error
            errorDiv.style.display = "block";
        }
    }
</script>

</body>
</html>
